# Default applications for file extensions on macOS.
#
# Declarative config for `dutis` (https://tsonglew.github.io/dutis/) read by
# ./default-apps-sync, which applies it only when an association drifted away
# from what is written here.
#
# Purpose: reproduce my default-app choices (editor, viewers, browser) on any
# Mac, and undo silent takeovers by apps that claim file types at install time.
#
# Not listed on purpose:
# - .fs: Xcode ships the GLSL "fragment shader" UTI for it while VS Code registers
#   its own type, and duti and Launch Services disagree on the read-back, so dutis
#   can never verify a change there.
# - .zip/.tar/.gz: Archive Utility cannot be resolved by path or bundle ID because
#   it lives outside the directories dutis scans. It is the macOS default anyway.
version = 2

[associations]

# Editor (code, config, plain text) -> dev.zed.Zed
ascx = "dev.zed.Zed"
asp = "dev.zed.Zed"
aspx = "dev.zed.Zed"
